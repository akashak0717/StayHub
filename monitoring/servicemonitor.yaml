apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: stayhub
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - stayhub

  selector:
    matchLabels:
      app.kubernetes.io/name: stayhub

  endpoints:
    - port: http
      path: /metrics
      interval: 30s